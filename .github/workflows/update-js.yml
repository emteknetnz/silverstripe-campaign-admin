name: Update JS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to run action on'
        required: true
        default: 'curr-major-next-minor'
        type: choice
        options:
          - 'prev-major-curr-minor'
          - 'curr-major-curr-minor'
          - 'curr-major-next-minor'
  # At 4:20 AM UTC, on day 1 of the month, only in March and September
  schedule:
    - cron: '20 4 1,2,3 3,9 *'

permissions: {}

jobs:
  update-js:
    name: Update JS
    # Only run cron on the silverstripe account
    if: (github.event_name == 'schedule' && github.repository_owner == 'silverstripe') || (github.event_name != 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Update JS
        uses: emteknetnz/gha-update-js@main
        with:
          branch: ${{ github.event.inputs.branch }}
